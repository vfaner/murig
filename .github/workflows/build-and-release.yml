name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:  # 允许手动触发（调试用）

permissions:
  contents: write  # 需要写权限来创建 Release

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            kind: windows
            asset: murig.exe
          - os: macos-26
            kind: macos
            asset: murig-macos-arm64.zip
          - os: macos-26-intel
            kind: macos
            asset: murig-macos-x64.zip
          - os: ubuntu-latest
            kind: linux
            asset: murig-linux-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Linux)
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller murig.spec --noconfirm --clean

      - name: Pack macOS app
        if: matrix.kind == 'macos'
        run: |
          cd dist
          zip -ry ${{ matrix.asset }} murig.app

      - name: Rename Linux binary
        if: matrix.kind == 'linux'
        run: |
          mv dist/murig dist/murig-linux-x64
          chmod +x dist/murig-linux-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # 仅打 tag 时发布；workflow_dispatch 只构建供调试下载
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          # 每个产物目录名即 asset 名，pattern 展平后直接位于 release-assets 下
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/murig.exe
            release-assets/murig-macos-arm64.zip
            release-assets/murig-macos-x64.zip
            release-assets/murig-linux-x64
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
